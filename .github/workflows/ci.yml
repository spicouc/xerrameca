name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Enforce standalone boundary
        run: |
          if grep -R -n -E '(^|[[:space:]])(from|import)[[:space:]]+pluribus([.]|[[:space:]]|$)' src; then
            echo 'Direct pluribus.* imports are forbidden in Xerrameca.'
            exit 1
          fi
      - name: Test
        run: pytest -q
      - name: Build standalone container
        run: docker build -t xerrameca-ci .
